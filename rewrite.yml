---
type: specs.openrewrite.org/v1beta/recipe
name: JavaxToJakarta
displayName: Migrate servlet and JSP Java references to Jakarta
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: "**/*.java"
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: javax.servlet
      newPackageName: jakarta.servlet
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: javax.activation
      newPackageName: jakarta.activation
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: javax.mail
      newPackageName: jakarta.mail
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.mail2.javax
      newPackageName: org.apache.commons.mail2.jakarta
      recursive: true
---
type: specs.openrewrite.org/v1beta/recipe
name: JakartaToJavax
displayName: Migrate Jakarta references to Javax
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: "**/*.java"
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: jakarta.servlet
      newPackageName: javax.servlet
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: jakarta.activation
      newPackageName: javax.activation
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: jakarta.mail
      newPackageName: javax.mail
      recursive: true
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.mail2.jakarta
      newPackageName: org.apache.commons.mail2.javax
      recursive: true
